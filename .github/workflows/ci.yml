name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: CLI smoke
        run: |
          python -m solvamath --version
          SOLVAMATH_DATA_DIR="$RUNNER_TEMP/solvamath" python -m solvamath --stats
      - name: Installer smoke
        run: bash tests/install-smoke.sh
